# ============================================================
# PRODUCTION DOCKER COMPOSE FOR EC2
# ============================================================
# Location on EC2: /home/ubuntu/app/docker-compose.yaml
# Pulls latest Docker Hub images built by GitHub Actions CI/CD.
# ============================================================

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - gateway

  gateway:
    image: heyzayn/simpleride-gateway:latest
    container_name: gateway
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env.gateway
    depends_on:
      - auth-service
      - location-service
      - notification-service
      - ride-service

  auth-service:
    image: heyzayn/simpleride-auth:latest
    container_name: auth-service
    restart: always
    ports:
      - "3001:4001"
    env_file:
      - .env.auth

  location-service:
    image: heyzayn/simpleride-location:latest
    container_name: location-service
    restart: always
    ports:
      - "3002:4002"
      - "50051:50051"
    env_file:
      - .env.location

  notification-service:
    image: heyzayn/simpleride-notification:latest
    container_name: notification-service
    restart: always
    ports:
      - "3003:4003"
    env_file:
      - .env.notification

  ride-service:
    image: heyzayn/simpleride-ride:latest
    container_name: ride-service
    restart: always
    ports:
      - "3004:4004"
    env_file:
      - .env.ride
