# ============================================================
# PRODUCTION DOCKER COMPOSE FOR EC2
# ============================================================
# Location on EC2: /home/ubuntu/app/docker-compose.yaml
# Pulls latest Docker Hub images built by GitHub Actions CI/CD.
# ============================================================

name: uber

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - gateway

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    image: heyzayn/simpleride-gateway:latest
    container_name: gateway
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env.gateway
    depends_on:
      - auth-service
      - location-service
      - notification-service
      - ride-service

  auth-service:
    image: heyzayn/simpleride-auth:latest
    container_name: auth-service
    restart: always
    ports:
      - "3001:4001"
    env_file:
      - .env.auth
    depends_on:
      redis:
        condition: service_healthy

  location-service:
    image: heyzayn/simpleride-location:latest
    container_name: location-service
    restart: always
    ports:
      - "3002:4002"
      - "50051:50051"
    env_file:
      - .env.location
    depends_on:
      redis:
        condition: service_healthy

  notification-service:
    image: heyzayn/simpleride-notification:latest
    container_name: notification-service
    restart: always
    ports:
      - "3003:4003"
    env_file:
      - .env.notification
    depends_on:
      redis:
        condition: service_healthy

  ride-service:
    image: heyzayn/simpleride-ride:latest
    container_name: ride-service
    restart: always
    ports:
      - "3004:4004"
    env_file:
      - .env.ride
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
