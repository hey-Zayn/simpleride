# ============================================================
# PRODUCTION DOCKER COMPOSE FOR EC2
# ============================================================
# Use this configuration on your EC2 instance in /home/ubuntu/app/docker-compose.yaml
# It pulls pre-built Docker Hub images instead of building from source on the server.
# ============================================================

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  gateway:
    image: heyzayn/gateway:latest
    container_name: gateway
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/gateway/.env
    depends_on:
      - auth-service
      - location-service
      - notification-service
      - ride-service

  auth-service:
    image: heyzayn/auth-service:latest
    container_name: auth-service
    restart: always
    ports:
      - "3001:4001"
    env_file:
      - ./backend/services/auth-service/.env

  location-service:
    image: heyzayn/location-service:latest
    container_name: location-service
    restart: always
    ports:
      - "3002:4002"
      - "50051:50051"
    env_file:
      - ./backend/services/location-service/.env

  notification-service:
    image: heyzayn/notification-service:latest
    container_name: notification-service
    restart: always
    ports:
      - "3003:4003"
    env_file:
      - ./backend/services/notification-service/.env

  ride-service:
    image: heyzayn/ride-service:latest
    container_name: ride-service
    restart: always
    ports:
      - "3004:4004"
    env_file:
      - ./backend/services/ride-service/.env
