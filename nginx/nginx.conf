events {

}

http {
    upstream gateway {
        server gateway:5000;
    }
    server {
        listen 80;

        location / {
            proxy_pass http://gateway;

            # FIX #4: WebSocket upgrade headers required for Socket.IO connections.
            # Without these, the HTTP→WS protocol upgrade handshake fails and
            # Socket.IO falls back to HTTP long-polling (or drops connections entirely).
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
        location /test {
            return 200 "This is Nginx Baby!";
        }
    }
}