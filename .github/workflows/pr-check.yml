# ============================================================
# PR VALIDATION WORKFLOW — Build & Test Only
# ============================================================
# WHAT THIS DOES:
#   1. Runs on Pull Requests to main
#   2. Validates Docker image builds without pushing to Docker Hub
#   3. Ensures broken code/dependencies do not get merged to main
# ============================================================

name: Pull Request Check

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    name: 🔍 Detect Changes in PR
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Check changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'backend/gateway/**'
            auth:
              - 'backend/services/auth-service/**'
            location:
              - 'backend/services/location-service/**'
            notification:
              - 'backend/services/notification-service/**'
            ride:
              - 'backend/services/ride-service/**'

      - name: Generate Dynamic Build Matrix
        id: set-matrix
        run: |
          node -e '
            const changes = {
              gateway: process.env.GATEWAY === "true",
              auth: process.env.AUTH === "true",
              location: process.env.LOCATION === "true",
              notification: process.env.NOTIFICATION === "true",
              ride: process.env.RIDE === "true",
            };
            const services = [
              { image_name: "simpleride-gateway", context: "./backend/gateway", filter_key: "gateway" },
              { image_name: "simpleride-auth", context: "./backend/services/auth-service", filter_key: "auth" },
              { image_name: "simpleride-location", context: "./backend/services/location-service", filter_key: "location" },
              { image_name: "simpleride-notification", context: "./backend/services/notification-service", filter_key: "notification" },
              { image_name: "simpleride-ride", context: "./backend/services/ride-service", filter_key: "ride" },
            ];
            const matrix = services.filter(s => changes[s.filter_key]);
            const fs = require("fs");
            const output = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(output, `has_changes=${matrix.length > 0}\n`);
            fs.appendFileSync(output, `matrix=${JSON.stringify({ include: matrix })}\n`);
          '
        env:
          GATEWAY: ${{ steps.changes.outputs.gateway }}
          AUTH: ${{ steps.changes.outputs.auth }}
          LOCATION: ${{ steps.changes.outputs.location }}
          NOTIFICATION: ${{ steps.changes.outputs.notification }}
          RIDE: ${{ steps.changes.outputs.ride }}

  verify-builds:
    name: 🧪 Test Build ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Note: push is set to false because this is just a PR test check
      - name: Test Build (dry-run)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha
