# ============================================================
# MAIN CI/CD PIPELINE — Build, Push & Deploy
# ============================================================
# WHAT THIS DOES:
#   1. Detects which microservices have code changes
#   2. Builds Docker images ONLY for modified services
#   3. Pushes images to Docker Hub (tagged with commit SHA + latest)
#   4. SSHes into EC2 and pulls updated images & restarts containers
#
# WHEN IT RUNS:
#   - Every push to the "main" branch
#
# REQUIRED GITHUB SECRETS:
#   DOCKERHUB_USERNAME  — Your Docker Hub username (e.g. heyzayn)
#   DOCKERHUB_TOKEN     — Docker Hub Access Token
#   EC2_HOST            — Public/Elastic IP of EC2 (e.g. 35.154.165.80)
#   EC2_USERNAME        — SSH user (ubuntu)
#   EC2_SSH_KEY         — RSA Private Key (.pem content)
#   EC2_APP_PATH        — Directory on EC2 (e.g. /home/ubuntu/app)
# ============================================================

name: Deploy Backend Services to EC2

on:
  push:
    branches: [main]

jobs:
  # ─── JOB 1: DETECT CHANGED SERVICES ─────────────────────────
  detect-changes:
    name: 🔍 Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.changes.outputs.gateway }}
      auth: ${{ steps.changes.outputs.auth }}
      location: ${{ steps.changes.outputs.location }}
      notification: ${{ steps.changes.outputs.notification }}
      ride: ${{ steps.changes.outputs.ride }}
      any_changed: ${{ steps.changes.outputs.gateway == 'true' || steps.changes.outputs.auth == 'true' || steps.changes.outputs.location == 'true' || steps.changes.outputs.notification == 'true' || steps.changes.outputs.ride == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check which service paths changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'backend/gateway/**'
            auth:
              - 'backend/services/auth-service/**'
            location:
              - 'backend/services/location-service/**'
            notification:
              - 'backend/services/notification-service/**'
            ride:
              - 'backend/services/ride-service/**'

  # ─── JOB 2: BUILD & PUSH DOCKER IMAGES IN PARALLEL ─────────
  build-and-push:
    name: 🐳 Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        include:
          - service: gateway
            context: ./backend/gateway
            filter_key: gateway
          - service: auth-service
            context: ./backend/services/auth-service
            filter_key: auth
          - service: location-service
            context: ./backend/services/location-service
            filter_key: location
          - service: notification-service
            context: ./backend/services/notification-service
            filter_key: notification
          - service: ride-service
            context: ./backend/services/ride-service
            filter_key: ride

    # Only run the build job if files in this specific service changed
    if: needs.detect-changes.outputs[matrix.filter_key] == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 3: DEPLOY ON EC2 VIA SSH ───────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    # Runs when build-and-push finishes or was skipped because no services built,
    # but at least one service was changed and all builds succeeded.
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.detect-changes.outputs.any_changed == 'true'

    steps:
      - name: SSH into EC2 & Restart Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=========================================="
            echo "🚀 Starting Automated Deployment..."
            echo "=========================================="
            
            cd ${{ secrets.EC2_APP_PATH }}
            
            echo "📦 Pulling latest Docker images from Docker Hub..."
            docker compose pull
            
            echo "🔄 Applying updates and restarting containers..."
            docker compose up -d --remove-orphans
            
            echo "🧹 Pruning old unused dangling images..."
            docker image prune -f
            
            echo "=========================================="
            echo "✅ Deployment Finished! Current container status:"
            echo "=========================================="
            docker compose ps
