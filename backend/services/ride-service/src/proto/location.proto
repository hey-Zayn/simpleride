syntax = "proto3";

package location;

// Enum representing vehicle types for type safety
enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  BIKE = 1;
  AUTO = 2;
  CAB_ECONOMY = 3;
  CAB_PREMIUM = 4;
}

// Request message for querying nearby drivers
message NearbyDriversRequest {
  double latitude = 1;
  double longitude = 2;
  double radius_km = 3;
  optional VehicleType vehicle_type = 4;
}

// Single driver location details
message DriverLocation {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  VehicleType vehicle_type = 4;
  double distance_km = 5;
}

// Response payload containing matching drivers
message NearbyDriversResponse {
  repeated DriverLocation drivers = 1;
}

// Service defining radial location lookup RPCs
service LocationService {
  rpc GetNearbyDrivers (NearbyDriversRequest) returns (NearbyDriversResponse);
}